<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifikasi - Superadmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/laporan.css?v=4">
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">KSOP <span>Cirebon</span></div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>
    <div class="main-area" id="mainArea">
      <header class="topbar" id="topbar"></header>
      <main class="main-content">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title" id="pageTitle">Notifikasi</h3>
            <button type="button" class="btn btn-primary btn-sm" onclick="showSendModal()">Kirim Notifikasi</button>
          </div>
          <div id="notifContent">
            <div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>
          </div>
        </div>
      </main>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <div class="modal-overlay" id="sendModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Kirim Notifikasi</h3>
        <button type="button" class="modal-close" onclick="closeSendModal()">&times;</button>
      </div>
      <form onsubmit="sendNotification(event)">
        <div class="form-group">
          <label>Tujuan</label>
          <select id="sendTarget">
            <option value="">Broadcast ke semua pengguna aktif</option>
          </select>
        </div>
        <div class="form-group">
          <label>Judul</label>
          <input type="text" id="sendTitle" required maxlength="255">
        </div>
        <div class="form-group">
          <label>Pesan</label>
          <textarea id="sendMessage" rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label>Tipe</label>
          <select id="sendType">
            <option value="info">Info</option>
            <option value="success">Sukses</option>
            <option value="warning">Peringatan</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="closeSendModal()">Batal</button>
          <button type="submit" class="btn btn-primary">Kirim</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/superadmin-navigation.js"></script>
  <script src="/js/layouts/superadmin-layout.js"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/superadmin/_layout.js"></script>
  <script src="/superadmin/notifikasi.js?v=1"></script>
</body>
</html>
