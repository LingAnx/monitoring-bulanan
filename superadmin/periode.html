<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Periode - Superadmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/laporan.css?v=4">
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">KSOP <span>Cirebon</span></div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>
    <div class="main-area" id="mainArea">
      <header class="topbar" id="topbar"></header>
      <main class="main-content">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title" id="pageTitle">Manajemen Periode</h3>
            <button type="button" class="btn btn-primary btn-sm" onclick="showPeriodeModal()">+ Tambah Periode</button>
          </div>
          <div id="periodeContent">
            <div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>
          </div>
        </div>
      </main>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <div class="modal-overlay" id="periodeModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 class="modal-title" id="periodeModalTitle">Tambah Periode</h3>
        <button type="button" class="modal-close" onclick="closePeriodeModal()">&times;</button>
      </div>
      <form id="periodeForm" onsubmit="savePeriode(event)">
        <input type="hidden" id="periodeId" value="">
        <div class="form-group">
          <label>Bulan</label>
          <select id="periodeBulan" required>
            <option value="1">Januari</option><option value="2">Februari</option>
            <option value="3">Maret</option><option value="4">April</option>
            <option value="5">Mei</option><option value="6">Juni</option>
            <option value="7">Juli</option><option value="8">Agustus</option>
            <option value="9">September</option><option value="10">Oktober</option>
            <option value="11">November</option><option value="12">Desember</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tahun</label>
          <input type="number" id="periodeTahun" min="2000" max="2100" required>
        </div>
        <div class="form-group">
          <label>Tanggal Mulai</label>
          <input type="date" id="periodeMulai" required>
        </div>
        <div class="form-group">
          <label>Deadline</label>
          <input type="date" id="periodeDeadline" required>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="periodeStatus">
            <option value="aktif">Aktif</option>
            <option value="ditutup">Ditutup</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="closePeriodeModal()">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/superadmin-navigation.js"></script>
  <script src="/js/layouts/superadmin-layout.js"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/superadmin/_layout.js"></script>
  <script src="/superadmin/periode.js?v=1"></script>
</body>
</html>
