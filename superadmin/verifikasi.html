<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi - KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/laporan.css">
  <link rel="stylesheet" href="/verify.css">
</head>
<body>
  <div class="layout" id="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">KSOP <span>Cirebon</span></div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <a href="/superadmin/dashboard.html" class="nav-item" data-page="dashboard">
          <span class="nav-icon">&#9776;</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <div class="nav-section">
          <div class="nav-section-title">Verifikasi</div>
          <a href="/superadmin/verifikasi.html" class="nav-item" data-page="persetujuan">
            <span class="nav-icon">&#10003;</span>
            <span class="nav-label">Verifikasi Laporan</span>
          </a>
          <a href="/superadmin/pengguna.html" class="nav-item" data-page="pegawai">
            <span class="nav-icon">&#9825;</span>
            <span class="nav-label">Data Pegawai</span>
          </a>
          <a href="/superadmin/verifikasi.html" class="nav-item" data-page="laporan">
            <span class="nav-icon">&#128196;</span>
            <span class="nav-label">Laporan Masuk</span>
          </a>
        </div>
        <a href="/superadmin/dashboard.html" class="nav-item" data-page="notif">
          <span class="nav-icon">&#9888;</span>
          <span class="nav-label">Notifikasi</span>
          <span class="nav-badge hidden" id="sidebarNotifBadge">0</span>
        </a>
        <div class="sidebar-footer">
          <a href="/login.html" class="nav-item" onclick="handleLogout()">
            <span class="nav-icon">&#10140;</span>
            <span class="nav-label">Logout</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn">&#9776;</button>
          <h1 class="page-title" id="pageTitle">Verifikasi Laporan</h1>
        </div>
        <div class="topbar-right">
          <div class="user-badge">
            <span id="userName"></span>
            <span class="role-tag" id="roleBadge"></span>
          </div>
          <a href="/superadmin/dashboard.html" class="notif-btn" id="notifBtn">
            &#128276;
            <span class="notif-badge hidden" id="notifBadge">0</span>
          </a>
          <button type="button" class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
      </header>

      <!-- Content -->
      <main class="main-content">
        <!-- Tab Navigation -->
        <div class="verify-tabs" id="verifyTabs">
          <button type="button" class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">📋 Laporan Masuk</button>
          <button type="button" class="tab-btn" data-tab="history" onclick="switchTab('history')">🕐 Riwayat Verifikasi</button>
          <button type="button" class="tab-btn" data-tab="deadline" onclick="switchTab('deadline')">⏰ Monitoring Deadline</button>
        </div>

        <!-- Tab Contents -->
        <div id="tab-pending">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Laporan Menunggu Verifikasi</h3>
              <button type="button" class="btn btn-outline btn-sm" onclick="loadPendingReports()">↻ Refresh</button>
            </div>
            <div id="verifyContent">
              <div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>
            </div>
          </div>
        </div>

        <div id="tab-history" class="tab-content-hidden">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Riwayat Verifikasi</h3>
              <button type="button" class="btn btn-outline btn-sm" onclick="loadVerifyHistory()">↻ Refresh</button>
            </div>
            <div id="historyContent">
              <div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>
            </div>
          </div>
        </div>

        <div id="tab-deadline" class="tab-content-hidden">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Monitoring Pengiriman Laporan</h3>
              <select id="deadlineBulan" onchange="loadDeadline()" title="Pilih bulan" style="padding:6px 10px;border:1px solid var(--gray-300);border-radius:6px;font-family:inherit">
                <option value="1">Januari</option><option value="2">Februari</option>
                <option value="3">Maret</option><option value="4">April</option>
                <option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option>
                <option value="9">September</option><option value="10">Oktober</option>
                <option value="11">November</option><option value="12">Desember</option>
              </select>
              <select id="deadlineTahun" onchange="loadDeadline()" title="Pilih tahun" style="padding:6px 10px;border:1px solid var(--gray-300);border-radius:6px;font-family:inherit">
                <option value="2026">2026</option><option value="2025">2025</option>
              </select>
            </div>
            <div id="deadlineContent">
              <div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Verify Modal -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h3 class="modal-title" id="modalTitle">Detail Laporan</h3>
          <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/superadmin-navigation.js"></script>
  <script src="/js/layouts/superadmin-layout.js"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/superadmin/_layout.js"></script>
  <script src="/superadmin/verifikasi.js?v=3"></script>
</body>
</html>
