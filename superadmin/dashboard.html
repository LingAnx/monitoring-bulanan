<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - Sistem Laporan Bulanan</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/laporan.css">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <!-- HEADER -->
  <div class="layout" id="layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          KSOP <span>Cirebon</span>
        </div>
  
        <button
          type="button"
          class="sidebar-toggle"
          id="sidebarToggle"
          aria-label="Toggle menu">
          &#9776;
        </button>
      </div>
  
      <nav class="sidebar-nav" id="sidebarNav"></nav>
  
      <div class="sidebar-footer"></div>
    </aside>
  
    <div class="main-area" id="mainArea">
  
      <header class="topbar"></header>
  
      <main class="main-content" id="mainContent">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Memuat dashboard...</p>
        </div>
      </main>
  
    </div>
  
    <div
      class="sidebar-overlay"
      id="sidebarOverlay">
    </div>
  
  </div>

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/superadmin-navigation.js"></script>
  <script src="/js/layouts/superadmin-layout.js"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/superadmin/_layout.js"></script>
  <script src="/superadmin/dashboard.js?v=4"></script>

</body>
</html>
