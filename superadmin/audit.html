<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Trail - Superadmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/laporan.css?v=4">
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">KSOP <span>Cirebon</span></div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>
    <div class="main-area" id="mainArea">
      <header class="topbar" id="topbar"></header>
      <main class="main-content">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title" id="pageTitle">Audit Trail</h3>
            <div class="filter-bar">
              <select id="filterBulan" title="Filter bulan" class="filter-select">
                <option value="">Semua Bulan</option>
                <option value="1">Januari</option><option value="2">Februari</option>
                <option value="3">Maret</option><option value="4">April</option>
                <option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option>
                <option value="9">September</option><option value="10">Oktober</option>
                <option value="11">November</option><option value="12">Desember</option>
              </select>
              <select id="filterTahun" title="Filter tahun" class="filter-select">
                <option value="">Semua Tahun</option>
                <option value="2026">2026</option><option value="2025">2025</option>
              </select>
              <select id="filterAction" title="Filter aksi" class="filter-select">
                <option value="">Semua Aksi</option>
                <option value="user.">User</option>
                <option value="periode.">Periode</option>
                <option value="report.">Laporan</option>
                <option value="notification.">Notifikasi</option>
                <option value="backup.">Backup</option>
                <option value="settings.">Settings</option>
              </select>
              <button type="button" class="btn btn-primary btn-sm" data-click-action="loadAudit">Terapkan</button>
            </div>
          </div>
          <div id="auditContent">
            <div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>
          </div>
          <div id="auditPagination" style="padding:16px;display:flex;justify-content:center;gap:8px"></div>
        </div>
      </main>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>
  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/layout-shared.js"></script>
  <script src="/js/navigation/superadmin-navigation.js"></script>
  <script src="/js/layouts/superadmin-layout.js"></script>
  <script src="/js/security/encoding.js"></script>
<script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/superadmin/_layout.js"></script>
  <script src="/superadmin/audit.js?v=1"></script>
</body>
</html>
