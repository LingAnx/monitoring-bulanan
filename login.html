<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Pelaporan KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="login-bg">
    <div class="login-container">
      <div class="login-box">
        <div class="login-logo">
          <div class="logo-icon">KSOP</div>
          <h1>KELAS II CIREBON</h1>
          <p>Sistem Pelaporan Kinerja Bulanan</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Masukkan password" required autocomplete="current-password">
          </div>
          <div id="errorMessage" class="error-message"></div>
          <button type="submit" class="login-btn">
            <span id="loginBtnText">Masuk</span>
            <span id="loginBtnLoader" class="loader"></span>
          </button>
        </form>
        <div class="login-footer">
          <a href="/index.html">&#8592; Kembali ke Beranda</a>
          <p class="hint">Demo: admin/admin123 | pegawai/pegawai123</p>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/translations.js"></script>
  <script src="/login.js"></script>
</body>
</html>
