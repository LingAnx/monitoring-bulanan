<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Laporan - KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/laporan.css?v=4">
  <link rel="stylesheet" href="/form.css">
  <link rel="stylesheet" href="/lampiran.css">
</head>
<body>
  <div class="layout" id="layout">
    <!-- Sidebar (managed by employee-layout.js) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">★</div>
          <div class="logo-text">
            <span class="logo-title">KSOP Kelas II</span>
            <span class="logo-subtitle">Cirebon</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">☰</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar (managed by employee-layout.js) -->
      <header class="topbar" id="topbar"></header>

      <!-- Content -->
      <main class="main-container">
    <div class="form-container">
      <div class="card">
        <h2 class="form-title">Form Laporan Kinerja Bulanan</h2>
        <form id="laporanForm">
          <input type="hidden" id="laporanId" value="">

          <h3 class="section-title">A. Identitas</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Nama</label>
              <input type="text" id="nama" readonly>
            </div>
            <div class="form-group">
              <label>NIP</label>
              <input type="text" id="nip" readonly>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Seksi</label>
              <input type="text" id="seksiDisplay" readonly>
            </div>
            <div class="form-group">
              <label>Periode</label>
              <input type="month" id="bulanTahun" required>
            </div>
          </div>

          <h3 class="section-title">B. Kegiatan Bulanan</h3>
          <table class="activity-table" id="activityTable">
            <thead>
              <tr>
                <th style="width:40px">No</th>
                <th style="width:120px">Tanggal</th>
                <th>Kegiatan</th>
                <th style="width:100px">Aksi</th>
              </tr>
            </thead>
            <tbody id="activityBody"></tbody>
          </table>
          <button type="button" class="btn btn-outline btn-sm mt-2" onclick="addActivityRow()">+ Tambah Kegiatan</button>

          <h3 class="section-title mt-4">C. Capaian / Pekerjaan Utama</h3>
          <div class="form-group">
            <textarea id="capaian" rows="3" placeholder="Tuliskan capaian pekerjaan utama bulan ini..." required></textarea>
          </div>

          <h3 class="section-title">D. Kendala</h3>
          <div class="form-group">
            <textarea id="kendala" rows="2" placeholder="Tuliskan kendala yang dihadapi (jika ada)..."></textarea>
          </div>

          <h3 class="section-title">E. Tindak Lanjut</h3>
          <div class="form-group">
            <textarea id="tindakLanjut" rows="2" placeholder="Tuliskan tindak lanjut yang akan dilakukan..."></textarea>
          </div>

          <h3 class="section-title">F. Rencana Kegiatan Bulan Berikutnya</h3>
          <div class="form-group">
            <textarea id="rencana" rows="2" placeholder="Tuliskan rencana kegiatan bulan depan..."></textarea>
          </div>

          <h3 class="section-title">G. Lampiran <span class="lampiran-hint">(JPG, PNG, PDF, DOC — maks 10MB)</span></h3>
          <div class="form-group">
            <input type="hidden" id="lampiranData" value="[]">
            <label for="lampiranInput" class="lampiran-file-label">Pilih File Lampiran</label>
            <input type="file" id="lampiranInput" multiple accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx" onchange="handleLampiranChange(event)" title="Pilih lampiran" aria-label="Pilih lampiran">
            <div id="lampiranPreview"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="saveDraft()">Simpan Draft</button>
            <button type="submit" class="btn btn-primary">Ajukan Laporan</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
  
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  
</div>

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/employee-navigation.js?v=2"></script>
  <script src="/js/layouts/employee-layout.js?v=2"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/employee/_layout.js"></script>
  <script src="/employee/form.js?v=6"></script>
</body>
</html>
