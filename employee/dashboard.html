<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistem Laporan Bulanan KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/laporan.css">
</head>
<body>
  <div class="layout" id="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">&#9733;</div>
          <div class="logo-text">
            <span class="logo-title">KSOP</span>
            <span class="logo-subtitle">Cirebon</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <a href="/employee/dashboard.html" class="nav-item nav-item-active" data-page="dashboard">
          <span class="nav-icon">&#9733;</span>
          <span class="nav-label">Beranda</span>
        </a>

        <div class="nav-section">
          <div class="nav-section-title">LAPORAN</div>
          <a href="/employee/laporan.html" class="nav-item" data-page="laporan">
            <span class="nav-icon">&#128196;</span>
            <span class="nav-label">Laporan Saya</span>
          </a>
          <a href="/employee/form.html?action=create" class="nav-item" data-page="buat">
            <span class="nav-icon">&#43;</span>
            <span class="nav-label">Buat Laporan</span>
          </a>
          <a href="/employee/laporan.html?action=draft" class="nav-item" data-page="draft">
            <span class="nav-icon">&#128196;</span>
            <span class="nav-label">Draft</span>
            <span class="nav-badge hidden" id="draftBadge">0</span>
          </a>
          <a href="/employee/laporan.html?action=berjalan" class="nav-item" data-page="berjalan">
            <span class="nav-icon">&#9203;</span>
            <span class="nav-label">Laporan Berjalan</span>
            <span class="nav-badge hidden" id="berjalanBadge">0</span>
          </a>
          <a href="/employee/laporan.html?action=riwayat" class="nav-item" data-page="riwayat">
            <span class="nav-icon">&#128197;</span>
            <span class="nav-label">Riwayat Laporan</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">LAINNYA</div>
          <a href="/employee/notifikasi.html" class="nav-item" data-page="notif">
            <span class="nav-icon">&#128276;</span>
            <span class="nav-label">Notifikasi</span>
            <span class="nav-badge hidden" id="sidebarNotifBadge">0</span>
          </a>
          <a href="#" class="nav-item" data-page="statistik">
            <span class="nav-icon">&#128200;</span>
            <span class="nav-label">Statistik Saya</span>
          </a>
          <a href="/employee/profil.html" class="nav-item" data-page="profil">
            <span class="nav-icon">&#9825;</span>
            <span class="nav-label">Profil Saya</span>
          </a>
          <a href="#" class="nav-item" data-page="password">
            <span class="nav-icon">&#128274;</span>
            <span class="nav-label">Ubah Password</span>
          </a>
          <a href="#" class="nav-item" data-page="bantuan">
            <span class="nav-icon">&#9432;</span>
            <span class="nav-label">Bantuan</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="/login.html" class="nav-item logout-item" onclick="handleLogout()">
          <span class="nav-icon">&#10140;</span>
          <span class="nav-label">Logout</span>
        </a>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">&#9776;</button>
          <div class="topbar-welcome">
            <span class="welcome-greeting" id="greeting">Selamat Datang,</span>
            <span class="welcome-name" id="userName">-</span>
          </div>
          <div class="topbar-meta">
            <span class="role-tag" id="roleBadge">-</span>
            <span class="meta-separator">&#8226;</span>
            <span class="meta-seksi" id="seksiDisplay">-</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="period-badge" id="periodBadge">
            <span class="period-dot"></span>
            <span>Periode Aktif: <strong id="activePeriod">-</strong></span>
          </div>
          <a href="/employee/notifikasi.html" class="notif-btn" id="notifBtn" aria-label="Notifikasi">
            &#128276;
            <span class="notif-badge hidden" id="notifBadge">0</span>
          </a>
          <button type="button" class="logout-btn" onclick="handleLogout()" aria-label="Logout">Logout</button>
        </div>
      </header>

      <!-- Content -->
      <main class="main-content" id="mainContent">
        <!-- Skeleton Loading -->
        <div class="skeleton-dashboard" id="skeletonLoading">
          <div class="skeleton-hero">
            <div class="skeleton-line w-60"></div>
            <div class="skeleton-line w-40"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="skeleton-stats">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
          <div class="skeleton-grid">
            <div class="skeleton-card h-40"></div>
            <div class="skeleton-card h-40"></div>
          </div>
          <div class="skeleton-grid">
            <div class="skeleton-card h-30"></div>
            <div class="skeleton-card h-30"></div>
          </div>
        </div>
        <!-- Actual content loaded by JS -->
        <div id="dashboardContent"></div>
      </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Detail Laporan</h3>
        <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/employee-navigation.js"></script>
  <script src="/js/layouts/employee-layout.js"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/employee/_layout.js"></script>
  <script src="/employee/dashboard.js?v=9"></script>
</body>
</html>
