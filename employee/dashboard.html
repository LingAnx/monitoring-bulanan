<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistem Laporan Bulanan KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/laporan.css?v=4">
</head>
<body>
  <div class="layout" id="layout">
    <!-- Sidebar (managed by employee-layout.js) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">★</div>
          <div class="logo-text">
            <span class="logo-title">KSOP</span>
            <span class="logo-subtitle">Cirebon</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">☰</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Topbar (managed by employee-layout.js) -->
      <header class="topbar" id="topbar"></header>

      <!-- Content -->
      <main class="main-content" id="mainContent">
        <!-- Skeleton Loading -->
        <div class="skeleton-dashboard" id="skeletonLoading">
          <div class="skeleton-hero">
            <div class="skeleton-line w-60"></div>
            <div class="skeleton-line w-40"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="skeleton-stats">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
          <div class="skeleton-grid">
            <div class="skeleton-card h-40"></div>
            <div class="skeleton-card h-40"></div>
          </div>
          <div class="skeleton-grid">
            <div class="skeleton-card h-30"></div>
            <div class="skeleton-card h-30"></div>
          </div>
        </div>
        <!-- Actual content loaded by JS -->
        <div id="dashboardContent"></div>
      </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Detail Laporan</h3>
        <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/employee-navigation.js?v=2"></script>
  <script src="/js/layouts/employee-layout.js?v=2"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/employee/_layout.js"></script>
  <script src="/employee/dashboard.js?v=9"></script>
</body>
</html>
