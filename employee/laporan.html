<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan - KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/laporan.css?v=4">
</head>
<body>
  <div class="layout" id="layout">
    <!-- Sidebar (managed by admin-section-layout.js) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">★</div>
          <div class="logo-text">
            <span class="logo-title">KSOP</span>
            <span class="logo-subtitle">Cirebon</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">☰</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <!-- Main Area -->
    <div class="main-area" id="mainArea">
      <!-- Topbar (managed by admin-section-layout.js) -->
      <header class="topbar" id="topbar"></header>

      <!-- Content -->
      <main class="main-content">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title" id="pageTitle">Laporan Saya</h3>
            <div class="action-buttons">
              <select id="filterStatus" title="Filter status" class="filter-select">
                <option value="">Semua</option>
                <option value="diajukan">Diajukan</option>
                <option value="diteruskan">Diteruskan</option>
                <option value="disetujui">Disetujui</option>
                <option value="revisi_admin">Revisi Admin</option>
                <option value="revisi_kantor">Revisi Kantor</option>
              </select>
              <select id="filterBulan" title="Filter bulan" class="filter-select">
                <option value="">Semua Bulan</option>
                <option value="1">Januari</option><option value="2">Februari</option>
                <option value="3">Maret</option><option value="4">April</option>
                <option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option>
                <option value="9">September</option><option value="10">Oktober</option>
                <option value="11">November</option><option value="12">Desember</option>
              </select>
              <select id="filterTahun" title="Filter tahun" class="filter-select">
                <option value="2026">2026</option><option value="2025">2025</option>
              </select>
              <button type="button" class="btn btn-outline btn-sm" onclick="exportPDF(event)">📄 Export PDF</button>
              <button type="button" class="btn btn-success btn-sm" onclick="exportCSV(event)">📊 Export Excel</button>
            </div>
          </div>
          <div id="laporanContent">
            <div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <script src="/translations.js"></script>
  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
      <script src="/js/navigation/employee-navigation.js?v=2"></script>
  <script src="/js/layouts/employee-layout.js?v=2"></script>
  <script src="/app.js"></script>
  <script src="/employee/_layout.js"></script>
  <script src="/employee/laporan.js?v=4"></script>
</body>
</html>
