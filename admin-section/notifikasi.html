<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifikasi - KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/laporan.css">
  <link rel="stylesheet" href="/notifikasi.css">
  <link rel="stylesheet" href="/admin-section-layout.css">
</head>
<body>
  <div class="layout admin-section-layout" id="layout">
    <!-- Sidebar (managed by admin-section-layout.js) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">&#9733;</div>
          <div class="logo-text">
            <span class="logo-title">KSOP</span>
            <span class="logo-subtitle">Cirebon</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <!-- Main Area -->
    <div class="main-area admin-section-content" id="mainArea">
      <!-- Topbar (managed by admin-section-layout.js) -->
      <header class="topbar" id="topbar"></header>

      <!-- Content -->
      <main class="admin-content notif-main">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Notifikasi</h3>
            <div class="notif-actions">
              <button type="button" class="btn btn-outline btn-sm" id="markAllReadBtn" onclick="markAllRead()">Tandai Semua Dibaca</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="loadNotifications()">↻ Refresh</button>
            </div>
          </div>
          <div id="notifContent">
            <div class="loading-state"><div class="spinner"></div><p>Memuat notifikasi...</p></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/admin-section-navigation.js"></script>
  <script src="/js/layouts/admin-section-layout.js"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/admin-section/_layout.js"></script>
  <script src="/admin-section/notifikasi.js?v=4"></script>
</body>
</html>
