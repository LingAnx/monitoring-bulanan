<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:* https://localhost:*; base-uri 'self'; form-action 'self'" />
  <title>Ubah Password</title>
  <link rel="stylesheet" href="profil.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Ubah Password</h1>
      <p class="sub">Password wajib diubah sebelum melanjutkan ke dashboard.</p>
      <form id="changePasswordForm" novalidate>
        <div class="field">
          <label for="newPassword">Password Baru</label>
          <input type="password" id="newPassword" autocomplete="new-password"
                 required minlength="8"
                 pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                 placeholder="Minimal 8 karakter, min. 1 huruf & 1 angka" />
        </div>
        <div class="field">
          <label for="confirmNewPassword">Konfirmasi Password Baru</label>
          <input type="password" id="confirmNewPassword" autocomplete="new-password" required />
        </div>
        <div id="cpErrorMessage" class="error-message" role="alert"></div>
        <button type="submit" class="login-btn">
          <span id="cpBtnText">Simpan Password</span>
          <span id="cpBtnLoader" style="display:none">Memproses…</span>
        </button>
      </form>
      <p class="hint">Setelah menyimpan, Anda akan diarahkan ke dashboard sesuai role Anda.</p>
    </div>
  </div>
  <script src="translations.js"></script>
  <script src="js/auth/auth-store.js"></script>
  <script src="change-password.js"></script>
</body>
</html>
