<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/laporan.css">
  <link rel="stylesheet" href="/profil.css?v=2">
  <link rel="stylesheet" href="/head-office-layout.css">
</head>
<body>
  <div class="layout admin-section-layout" id="layout">
    <!-- Sidebar (managed by admin-section-layout.js) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">&#9733;</div>
          <div class="logo-text">
            <span class="logo-title">KSOP</span>
            <span class="logo-subtitle">Cirebon</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <!-- Main Area -->
    <div class="main-area admin-section-content" id="mainArea">
      <!-- Topbar (managed by admin-section-layout.js) -->
      <header class="topbar" id="topbar"></header>

      <!-- Content -->
      <main class="admin-content">
        <div class="row">
          <div class="col profile-card">
            <div class="profile-header">
              <div class="profile-avatar" id="avatarInitials">?</div>
              <div class="profile-info">
                <h2 class="profile-name" id="profilNama">-</h2>
                <p class="profile-role" id="profilRole">-</p>
                <p class="profile-seksi" id="profilSeksi">-</p>
              </div>
            </div>
            <div class="profile-details">
              <div class="detail-row"><span class="detail-label">Nama</span><span id="infoNama">-</span></div>
              <div class="detail-row"><span class="detail-label">NIP</span><span id="infoNip">-</span></div>
              <div class="detail-row"><span class="detail-label">Username</span><span id="infoUsername">-</span></div>
              <div class="detail-row"><span class="detail-label">Jabatan</span><span id="infoJabatan">-</span></div>
              <div class="detail-row"><span class="detail-label">Seksi</span><span id="infoSeksi">-</span></div>
              <div class="detail-row"><span class="detail-label">Status</span><span id="infoStatus">-</span></div>
              <div class="detail-row"><span class="detail-label">Terdaftar Sejak</span><span id="infoCreated">-</span></div>
            </div>
          </div>
          <div class="col edit-card">
            <h3 class="edit-title">Edit Profil</h3>
            <form id="profilForm" onsubmit="saveProfile(event)">
              <div class="form-group">
                <label for="editNama">Nama Lengkap</label>
                <input type="text" id="editNama" name="editNama" required placeholder="Masukkan nama lengkap">
              </div>
              <div class="form-group">
                <label for="editNip">NIP</label>
                <input type="text" id="editNip" name="editNip" placeholder="Masukkan NIP">
              </div>
              <div class="form-group">
                <label>Password Baru (kosongkan jika tidak diubah)</label>
                <input type="password" id="editPassword" placeholder="Minimal 6 karakter">
              </div>
              <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="resetForm()">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/navigation/head-office-navigation.js"></script>
  <script src="/js/layouts/head-office-layout.js"></script>
  <script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/head-office/_layout.js"></script>
  <script src="/head-office/profil.js?v=3"></script>
</body>
</html>
