<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifikasi - KSOP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/laporan.css">
  <link rel="stylesheet" href="/notifikasi.css">
  <link rel="stylesheet" href="/head-office-layout.css">
</head>
<body>
  <div class="headoffice-layout" id="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon"><span class="icon icon-star" aria-hidden="true"></span></div>
          <div class="logo-text">
            <span class="logo-title">KSOP</span>
            <span class="logo-subtitle">Cirebon</span>
          </div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar"><span class="icon icon-menu" aria-hidden="true"></span></button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"></div>
    </aside>

    <!-- Main Area -->
    <div class="headoffice-content" id="mainArea">
      <!-- Topbar -->
      <header class="topbar" id="topbar"></header>

      <!-- Content -->
      <main class="admin-content">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Notifikasi</h3>
            <div class="notif-actions">
              <button type="button" class="btn btn-outline btn-sm" id="markAllReadBtn" data-click-action="markAllRead">Tandai Semua Dibaca</button>
              <button type="button" class="btn btn-outline btn-sm" data-click-action="loadNotifications">↻ Refresh</button>
            </div>
          </div>
          <div id="notifContent">
            <div class="loading-state"><div class="spinner"></div><p>Memuat notifikasi...</p></div>
          </div>
        </div>
      </main>
    </div><!-- /headoffice-content -->

    <!-- Sidebar Overlay (di dalam root .headoffice-layout agar CSS
         ter-scoped .headoffice-layout .sidebar-overlay menjangkau) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </div><!-- /headoffice-layout -->

  <script src="/js/auth/auth-store.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/layout-shared.js"></script>
  <script src="/js/navigation/head-office-navigation.js?v=2"></script>
  <script src="/js/layouts/head-office-layout.js?v=2"></script>
  <script src="/js/security/encoding.js"></script>
<script src="/app.js"></script>
  <script src="/translations.js"></script>
  <script src="/head-office/_layout.js"></script>
  <script src="/head-office/notifikasi.js?v=4"></script>
</body>
</html>
